[versions]
agp                         = "8.13.0"
kotlin                      = "2.0.21"
ksp                         = "2.0.21-1.0.28"
composeBom                  = "2024.10.00"
room                        = "2.6.1"
hilt                        = "2.52"
hiltNavigationCompose       = "1.2.0"

# AndroidX core
coreKtx                     = "1.15.0"
lifecycleRuntimeKtx         = "2.8.6"
activityCompose             = "1.9.3"
navigationCompose           = "2.8.3"
datastorePreferences        = "1.1.1"

# CameraX
camerax                     = "1.4.0"

# WorkManager
workmanager                 = "2.10.1"

# Biometric
biometric                   = "1.2.0-alpha05"

# Google Play Billing
billing                     = "7.1.1"

# Coroutines
coroutines                  = "1.9.0"

# Kotlin serialization
serialization               = "1.8.0"

# Testing
junit                       = "4.13.2"
junitAndroid                = "1.2.1"
espressoCore                = "3.6.1"
archCoreTesting             = "2.2.0"
turbine                     = "1.2.0"
mockito                     = "5.14.2"
mockitoKotlin               = "5.4.0"

[libraries]
# Compose BOM
androidx-compose-bom        = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }

# Compose — versions managed by BOM
androidx-compose-ui                     = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-graphics            = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-ui-tooling-preview     = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-ui-tooling             = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-test-manifest       = { group = "androidx.compose.ui", name = "ui-test-manifest" }
androidx-compose-ui-test-junit4         = { group = "androidx.compose.ui", name = "ui-test-junit4" }
androidx-compose-material3              = { group = "androidx.compose.material3", name = "material3" }
androidx-compose-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended" }
androidx-compose-runtime                = { group = "androidx.compose.runtime", name = "runtime" }
androidx-compose-foundation             = { group = "androidx.compose.foundation", name = "foundation" }

# AndroidX Core
androidx-core-ktx           = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycleRuntimeKtx" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycleRuntimeKtx" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycleRuntimeKtx" }
androidx-activity-compose   = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }

# Navigation
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigationCompose" }

# Room
androidx-room-runtime       = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
androidx-room-ktx           = { group = "androidx.room", name = "room-ktx", version.ref = "room" }
androidx-room-compiler      = { group = "androidx.room", name = "room-compiler", version.ref = "room" }
androidx-room-testing       = { group = "androidx.room", name = "room-testing", version.ref = "room" }

# Hilt
hilt-android                = { group = "com.google.dagger", name = "hilt-android", version.ref = "hilt" }
hilt-compiler               = { group = "com.google.dagger", name = "hilt-compiler", version.ref = "hilt" }
hilt-android-testing        = { group = "com.google.dagger", name = "hilt-android-testing", version.ref = "hilt" }
androidx-hilt-navigation-compose = { group = "androidx.hilt", name = "hilt-navigation-compose", version.ref = "hiltNavigationCompose" }
androidx-hilt-work          = { group = "androidx.hilt", name = "hilt-work", version.ref = "hiltNavigationCompose" }
androidx-hilt-compiler      = { group = "androidx.hilt", name = "hilt-compiler", version.ref = "hiltNavigationCompose" }

# DataStore
androidx-datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastorePreferences" }

# CameraX
androidx-camera-core        = { group = "androidx.camera", name = "camera-core", version.ref = "camerax" }
androidx-camera-camera2     = { group = "androidx.camera", name = "camera-camera2", version.ref = "camerax" }
androidx-camera-lifecycle   = { group = "androidx.camera", name = "camera-lifecycle", version.ref = "camerax" }
androidx-camera-view        = { group = "androidx.camera", name = "camera-view", version.ref = "camerax" }

# WorkManager
androidx-work-runtime-ktx   = { group = "androidx.work", name = "work-runtime-ktx", version.ref = "workmanager" }
androidx-work-testing       = { group = "androidx.work", name = "work-testing", version.ref = "workmanager" }

# Biometric
androidx-biometric          = { group = "androidx.biometric", name = "biometric", version.ref = "biometric" }

# Google Play Billing
play-billing                = { group = "com.android.billingclient", name = "billing-ktx", version.ref = "billing" }

# Coroutines
kotlinx-coroutines-android  = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-test     = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutines" }

# Serialization
kotlinx-serialization-json  = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "serialization" }

# Testing
junit                       = { group = "junit", name = "junit", version.ref = "junit" }
androidx-junit              = { group = "androidx.test.ext", name = "junit", version.ref = "junitAndroid" }
androidx-espresso-core      = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }
androidx-arch-core-testing  = { group = "androidx.arch.core", name = "core-testing", version.ref = "archCoreTesting" }
turbine                     = { group = "app.cash.turbine", name = "turbine", version.ref = "turbine" }
mockito-core                = { group = "org.mockito", name = "mockito-core", version.ref = "mockito" }
mockito-kotlin              = { group = "org.mockito.kotlin", name = "mockito-kotlin", version.ref = "mockitoKotlin" }

[plugins]
android-application         = { id = "com.android.application", version.ref = "agp" }
android-library             = { id = "com.android.library", version.ref = "agp" }
kotlin-android              = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose              = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization        = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
google-devtools-ksp         = { id = "com.google.devtools.ksp", version.ref = "ksp" }
hilt-android                = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
